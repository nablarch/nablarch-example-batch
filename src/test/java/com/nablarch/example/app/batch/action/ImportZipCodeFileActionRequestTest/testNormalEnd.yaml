setup_files:
  - group_id: "1"
    path: "work/test/importZipCode/importZipCode.csv"
    type: "variable"
    directives:
      file-type: "Variable"
      record-separator: "CRLF"
      text-encoding: "UTF-8"
      field-separator: ","
    records:
      - record_type: "データレコード"
        fields:
          - {name: "localGovernmentCode", type: "半角"}
          - {name: "zipCode5digit", type: "半角"}
          - {name: "zipCode7digit", type: "半角"}
          - {name: "prefectureKana", type: "半角"}
          - {name: "cityKana", type: "半角"}
          - {name: "addressKana", type: "半角"}
          - {name: "prefectureKanji", type: "全角"}
          - {name: "cityKanji", type: "全角"}
          - {name: "addressKanji", type: "全角"}
          - {name: "multipleZipCodes", type: "半角"}
          - {name: "numberedEveryKoaza", type: "半角"}
          - {name: "addressWithChome", type: "半角"}
          - {name: "multipleAddress", type: "半角"}
          - {name: "updateData", type: "半角"}
          - {name: "updateDataReason", type: "半角"}
        rows:
          - ["01101", "060  ", "0600000", "ﾎｯｶｲﾄﾞｳ", "ｻｯﾎﾟﾛｼﾁｭｳｵｳｸ", "ｲｶﾆｹｲｻｲｶﾞﾅｲﾊﾞｱｲ", "北海道", "札幌市中央区", "以下に掲載がない場合", "0", "0", "0", "0", "0", "0"]

